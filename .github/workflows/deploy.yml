name: Deploy

# SIMULATED deploy: same steps as the real S3 + CloudFront workflow, but instead
# of uploading it prints what it would do and saves dist/ as a downloadable
# artifact. Called by release.yml, or run by hand from the Actions tab to
# redeploy / roll back to any tag.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [development, staging, production]
        required: true
      ref:
        description: Release tag (e.g. v1.4.0); development also accepts a branch or commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    steps:
      # Staging/production only ever get a tested release, never a random branch.
      # REF goes through env so the input can't inject shell commands.
      - name: Only release tags can go to staging/production
        if: inputs.environment != 'development'
        env:
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$REF' is not a release tag (expected vX.Y.Z)"
            exit 1
          fi
          gh api "repos/${{ github.repository }}/git/ref/tags/$REF" --silent \
            || { echo "::error::Tag $REF does not exist"; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # git describe needs tags + history

      - uses: pnpm/action-setup@v6

      # No cache on manual runs, so a hand-picked ref can't poison the cache
      # that release runs on main restore (CodeQL actions/cache-poisoning)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ github.event_name != 'workflow_dispatch' && 'pnpm' || '' }}

      - run: pnpm install --frozen-lockfile

      - name: Check environment variables
        env:
          VITE_BACKEND_BASE_URL: ${{ vars.VITE_BACKEND_BASE_URL }}
        run: |
          missing=0
          for name in VITE_BACKEND_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the '${{ inputs.environment }}' GitHub Environment"
              missing=1
            fi
          done
          exit $missing

      # On a tag: "1.2.0". On an unreleased commit: "1.2.0-3-gabc1234"
      # (3 commits after v1.2.0), so dev doesn't pretend to be a release.
      - name: Work out version
        run: |
          echo "VITE_COMMIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_ENV"

      - name: Build
        env:
          VITE_BACKEND_BASE_URL: ${{ vars.VITE_BACKEND_BASE_URL }}
          VITE_APP_ENV: ${{ inputs.environment }}
        run: pnpm build

      - name: Simulate upload to S3 + CloudFront invalidation
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REF: ${{ inputs.ref }}
        run: |
          version="$APP_VERSION"
          commit="$VITE_COMMIT_SHA"
          bucket="s3://vite-cicd-playground-$ENVIRONMENT"

          echo "Would run:"
          echo "  aws s3 sync dist/assets $bucket/assets --cache-control 'public,max-age=31536000,immutable'"
          echo "  aws s3 sync dist $bucket --delete --exclude 'assets/*' --cache-control 'no-cache'"
          echo "  aws cloudfront create-invalidation --distribution-id <id> --paths '/*'"

          {
            echo "## Deployed to \`$ENVIRONMENT\` (simulated)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`$REF\` |"
            echo "| Version | \`$version\` |"
            echo "| Commit | \`$commit\` |"
            echo "| Bucket | \`$bucket\` |"
            echo
            echo "Files that would be uploaded:"
            echo
            echo '```'
            (cd dist && find . -type f -exec ls -l {} \; | awk '{print $5"\t"$9}')
            echo '```'
            echo
            echo "Download the **site-$ENVIRONMENT** artifact below and run \`npx serve\` in it to open this exact build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build as artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ inputs.environment }}
          path: dist
          retention-days: 7
