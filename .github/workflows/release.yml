name: Release

# main         → deploy to development, keep the Release PR up to date
# Release PR   → merged: tag vX.Y.Z -> (approval) → staging → (approval) → production
# hotfix/**    → same release flow for a patch cut from a production tag

on:
  push:
    branches:
      - main
      - "hotfix/**"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.ref_name }}

  deploy-development:
    needs: ci
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      ref: ${{ github.sha }}

  # On main, staging waits for the development deploy to succeed.
  # Hotfix branches skip development, so "skipped" is allowed too.
  deploy-staging:
    needs: [release-please, deploy-development]
    if: >-
      !cancelled() &&
      needs.release-please.outputs.release_created == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.deploy-development.result)
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ needs.release-please.outputs.tag_name }}

  # Waits for a required reviewer on the "production" GitHub Environment
  deploy-production:
    needs: [release-please, deploy-staging]
    if: ${{ !cancelled() && needs.deploy-staging.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ needs.release-please.outputs.tag_name }}

  # After a hotfix release, open a PR to bring it back into main so the fix
  # isn't lost and main's next version doesn't collide with the hotfix tag.
  # Needs RELEASE_PLEASE_TOKEN (a PAT): PRs opened with github.token don't
  # trigger CI, so the required "check" would never run.
  merge-back:
    needs: release-please
    if: >-
      startsWith(github.ref, 'refs/heads/hotfix/') &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open merge-back PR into main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh pr create --repo "${{ github.repository }}" \
            --base main --head "$BRANCH" \
            --title "chore: merge $BRANCH ($TAG) into main" \
            --body "Brings hotfix $TAG back into main.

          - Merge with **Create a merge commit**, not squash, so the tag is in main's history.
          - On conflicts in package.json, CHANGELOG.md or .release-please-manifest.json, keep **main's** (higher) version and add the $TAG changelog entry below it."
